<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="robots" content="noindex">
    <link rel="icon" href="/favicon.svg" type="image/svg+xml">
    <title>페이지를 찾을 수 없습니다 — SH Software</title>
    <style>
      * { box-sizing: border-box; }
      body { display: grid; min-height: 100vh; margin: 0; place-items: center; padding: 24px; background: #f4f1ea; color: #111827; font-family: system-ui, sans-serif; }
      main { width: min(620px, 100%); padding: clamp(36px, 8vw, 72px); border-radius: 30px; background: #111827; color: white; }
      p:first-child { margin: 0; color: #c6ff3d; font-size: .75rem; font-weight: 900; letter-spacing: .16em; }
      h1 { margin: 18px 0 14px; font-size: clamp(2.4rem, 7vw, 4.5rem); line-height: 1; letter-spacing: -.06em; }
      p { color: #b8c0cc; }
      a { display: inline-block; margin-top: 22px; padding: 13px 18px; border-radius: 12px; background: #c6ff3d; color: #111827; font-weight: 800; text-decoration: none; }
    </style>
  </head>
  <body>
    <main>
      <p>404 · PAGE NOT FOUND</p>
      <h1>길을 잠시 잃었습니다.</h1>
      <p>요청한 페이지가 없거나 주소가 변경되었습니다.</p>
      <a href="/">SH Software 홈으로</a>
    </main>
  </body>
</html>
